<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#F8FAFC"/>
  <!-- Desk -->
  <rect x="100" y="350" width="600" height="200" rx="4" fill="#E5E7EB"/>
  <!-- Laptop -->
  <rect x="220" y="150" width="360" height="230" rx="8" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="232" y="162" width="336" height="206" rx="4" fill="#F9FAFB"/>
  <!-- Design on screen -->
  <rect x="232" y="162" width="336" height="206" rx="4" fill="url(#aboutGrad)"/>
  <circle cx="400" cy="265" r="40" fill="#2563EB" opacity="0.2"/>
  <text x="400" y="270" text-anchor="middle" font-family="Manrope, sans-serif" font-size="14" font-weight="600" fill="#2563EB">NEXSKIN</text>
  <!-- Keyboard -->
