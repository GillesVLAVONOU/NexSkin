  <rect x="560" y="380" width="20" height="30" rx="2" fill="#2563EB" opacity="0.3"/>
  <rect x="180" y="365" width="30" height="50" rx="3" fill="#60A5FA" opacity="0.3"/>
  <!-- Plant -->
  <circle cx="660" cy="320" r="25" fill="#34D399" opacity="0.3"/>
  <rect x="656" y="340" width="8" height="30" rx="2" fill="#9CA3AF"/>
  <defs>
    <linearGradient id="aboutGrad" x1="232" y1="162" x2="568" y2="368">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
